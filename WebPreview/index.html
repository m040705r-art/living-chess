<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Chess Preview</title>
<style>
  :root { --bg: #0b0a09; --fg: #efe6d4; --dim: #a89e8c; --accent: #d9b56a; --panel: rgba(18,15,12,.78); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Yu Gothic UI", "Hiragino Sans", sans-serif; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 16px; top: 16px; background: var(--panel); border: 1px solid #3a3228; border-radius: 8px; padding: 12px 14px; max-width: 320px; }
  #hud h1 { font-size: 16px; margin: 0 0 6px; color: var(--accent); letter-spacing: .05em; }
  #status { font-size: 13px; color: var(--dim); min-height: 1.4em; }
  #buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  button { background: #2a231b; color: var(--fg); border: 1px solid #5a4a36; border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #1a140c; }
</style>
</head>
<body>
<div id="hud">
  <h1>Living Chess</h1>
  <div id="status">読み込み中…</div>
  <div id="buttons"></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

// carved-stone look: object-space value noise -> mottling + faint veins, plus a little roughness variation
function stoneify(mat, scale = 38, strength = 1) {
  mat.userData.uCrumble = { value: 0 };   // 0 = intact, ~0.9 = fully eaten away (death)
  mat.onBeforeCompile = sh => {
    sh.uniforms.uStoneScale = { value: scale };
    sh.uniforms.uStoneStrength = { value: strength };
    sh.uniforms.uCrumble = mat.userData.uCrumble;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
varying vec3 vStonePos;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
vStonePos = position;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
varying vec3 vStonePos; uniform float uStoneScale; uniform float uStoneStrength; uniform float uCrumble;
float sh3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float sn3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(sh3(i), sh3(i+vec3(1,0,0)), f.x), mix(sh3(i+vec3(0,1,0)), sh3(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(sh3(i+vec3(0,0,1)), sh3(i+vec3(1,0,1)), f.x), mix(sh3(i+vec3(0,1,1)), sh3(i+vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a * sn3(p); p *= 2.03; a *= 0.5; } return s; }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
if (uCrumble > 0.0) {   // stone flaking away in chunks, dark cracked rims around the holes
  float cr = fbm(vStonePos * 9.0);
  if (cr < uCrumble) discard;
  diffuseColor.rgb *= mix(1.0, 0.3, smoothstep(uCrumble + 0.07, uCrumble, cr));
}
vec3 sp = vStonePos * uStoneScale;
float n = fbm(sp);
float vein = 1.0 - smoothstep(0.0, 0.06, abs(sin(sp.x * 0.35 + sp.y * 0.2 + fbm(sp * 0.5) * 5.0)));
diffuseColor.rgb *= mix(1.0, 0.8 + 0.4 * n - 0.18 * vein, uStoneStrength);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
roughnessFactor = clamp(roughnessFactor + (n - 0.5) * 0.25 * uStoneStrength, 0.05, 1.0);`);
  };
  mat.customProgramCacheKey = () => 'stone' + scale;
}
// the stage: a sunset colosseum (user's arena sheet) - same sky, light and haze as Unity's ChessSceneBuilder.Arena
// (Unity z = -three z for these exports, so the sun direction's z is mirrored)
const HAZE = new THREE.Color(0.86, 0.68, 0.5), SUN_DIR = new THREE.Vector3(0.55, 0.24, 0.8).normalize();
scene.background = HAZE.clone();
scene.fog = new THREE.Fog(HAZE.getHex(), 30, 130);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 200);
camera.position.set(3.6, 2.1, 2.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.7, 0.5);
controls.enableDamping = true;
controls.autoRotate = true; controls.autoRotateSpeed = 0.35;

// lights: a low golden sun as the key + four of the parapet's fire bowls (kept few for iGPU)
scene.add(new THREE.HemisphereLight(0xc8d0e8, 0x5a4030, 0.8));
const key = new THREE.DirectionalLight(0xffcc8e, 2.2);
key.position.copy(SUN_DIR).multiplyScalar(8).add(new THREE.Vector3(0.5, 0, 0.5)); key.target.position.set(0.5, 0, 0.5); scene.add(key.target);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 15 });
scene.add(key);
const candles = [];   // the fire-bowl lights (flickered in the render loop); the other flames are emissive only
for (const deg of [36, 144, 216, 324]) {   // arena.py: tall pedestals every 36 deg at r 10.25
  const a = deg * Math.PI / 180, l = new THREE.PointLight(0xff9a48, 5, 9, 1.4);
  l.position.set(0.5 + Math.cos(a) * 10, 1.9, 0.5 + Math.sin(a) * 10); scene.add(l); candles.push(l);
}
// sky dome: the same procedural golden-hour sky as Unity's Chess/SunsetSky (gradient, low sun, drifting clouds)
const skyUniforms = { uTime: { value: 0 } };
scene.add(new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyUniforms,
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position + cameraPosition, 1.0); }',
  fragmentShader: `uniform float uTime; varying vec3 vDir;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vnoise(vec2 x){ vec2 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
    float fbm(vec2 x){ return vnoise(x) * 0.5 + vnoise(x * 2.1) * 0.3 + vnoise(x * 4.3) * 0.2; }
    void main(){
      vec3 d = normalize(vDir), top = vec3(0.22, 0.42, 0.72), hor = vec3(1.0, 0.74, 0.46), sunc = vec3(1.0, 0.86, 0.6);
      vec3 s = normalize(vec3(${SUN_DIR.x}, ${SUN_DIR.y}, ${SUN_DIR.z}));
      float h = clamp(d.y, 0.0, 1.0), sd = clamp(dot(d, s), 0.0, 1.0);
      vec3 c = mix(hor, top, pow(h, 0.45));
      c = mix(c, hor * 1.05, pow(sd, 6.0) * (1.0 - h) * 0.8);
      if (d.y < 0.0) c = hor * 0.85;
      vec2 uv = d.xz / max(0.08, d.y) * 0.35 + uTime * vec2(0.004, 0.002);
      float cl = smoothstep(0.5, 0.78, fbm(uv * 1.3)) * smoothstep(0.02, 0.2, d.y) * 0.8;
      vec3 cc = mix(vec3(0.95, 0.9, 0.86), sunc * 1.2, pow(sd, 3.0)) * mix(0.75, 1.1, fbm(uv * 3.1 + 5.0));
      c = mix(c, cc, cl);
      float ang = acos(clamp(dot(d, s), -1.0, 1.0));
      c += sunc * (0.5 * exp(-ang * 7.0) + 0.15 * exp(-ang * 1.8));
      c = mix(c, sunc * 2.2, smoothstep(0.035, 0.03, ang) * (1.0 - cl * 0.7));
      gl_FragColor = vec4(c, 1.0);
    }`
})));
// the colosseum (BlenderSource/arena.py), centred on the board. Colour is in the vertex colours; vertex alpha says
// how much a vertex may move: banners sway, the crowd bobs in a wave round the stands, flame tips flicker
// (the same vertex motion as Unity's Chess/Arena shader).
const arenaTime = { value: 0 };
function arenaMat(kind) {
  const P = { Marble: [0.55, 0], Gold: [0.35, 0.6], Cloth: [0.9, 0], Crowd: [0.9, 0], Fire: [1, 0], Dark: [0.95, 0] }[kind];
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: P[0], metalness: P[1], side: THREE.DoubleSide });
  if (kind === 'Fire') { m.emissive = new THREE.Color(1, 0.55, 0.2); m.emissiveIntensity = 2.5; }
  if (kind === 'Marble') stoneify(m, 2.2, 0.5);
  const mode = { Cloth: 1, Crowd: 2, Fire: 3 }[kind] || 0;
  if (mode) {
    const prev = m.onBeforeCompile;
    m.onBeforeCompile = (sh, r) => {
      if (prev) prev(sh, r);
      sh.uniforms.uTime = arenaTime;
      sh.vertexShader = 'uniform float uTime;\nattribute float _w;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
        { float w = _w; vec3 wp = (modelMatrix * vec4(transformed, 1.0)).xyz; float t = uTime;
          float ph = dot(wp, vec3(0.7, 0.31, 0.53));
          ${mode === 1 ? 'transformed += w * vec3(sin(t * 1.7 + ph), 0.0, cos(t * 1.3 + ph * 1.3)) * 0.09;' : ''}
          ${mode === 2 ? 'float ang = atan(wp.z, wp.x); transformed.y += w * (max(0.0, sin(ang * 6.0 - t * 2.2)) * 0.12 + max(0.0, sin(t * 7.0 + ang * 40.0)) * 0.03);' : ''}
          ${mode === 3 ? 'transformed += w * vec3(sin(t * 13.0 + ph * 5.0) * 0.04, sin(t * 17.0 + ph * 3.0) * 0.07, cos(t * 11.0 + ph * 7.0) * 0.04);' : ''}
        }`);
    };
    m.customProgramCacheKey = () => 'arena' + kind;
  }
  return m;
}
new GLTFLoader().loadAsync('models/Arena.glb?v=' + Date.now()).then(g => {
  const st = g.scene; st.position.set(0.5, 0, 0.5);
  st.traverse(o => {
    if (!o.isMesh) return;
    o.receiveShadow = true;
    o.geometry.setAttribute('color', o.geometry.attributes._c);   // arena.py "_c": COLOR_0 came out white for all but one primitive
    o.material = arenaMat(o.material.name.replace('Arena', ''));
  });
  scene.add(st); window.arenaRoot = st;   // debug handle
});

// board 8x8, 1 unit squares, polished
const board = new THREE.Group();
const light = new THREE.MeshStandardMaterial({ color: 0xbfb8a8, roughness: 0.22 }); stoneify(light, 2.2, 0.9);
const dark = new THREE.MeshStandardMaterial({ color: 0x1d1b1a, roughness: 0.18 }); stoneify(dark, 2.2, 0.9);
const sq = new THREE.BoxGeometry(1, 0.1, 1);
for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
  const m = new THREE.Mesh(sq, (i + j) % 2 ? dark : light);
  m.position.set(i - 3.5, -0.05, j - 3.5); m.receiveShadow = true; board.add(m);
}
const rim = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.16, 8.6), new THREE.MeshStandardMaterial({ color: 0x2a1c12, roughness: 0.5 }));
rim.position.y = -0.09; board.add(rim);
board.position.set(0.5, 0, 0.5);   // pieces stand on square centres
scene.add(board);

const status = document.getElementById('status');
const say = t => status.textContent = t;
const sleep = ms => new Promise(r => setTimeout(r, ms));
// a pawn wears its daggers sheathed: it draws them (and waits in guard) once a fight is coming
async function drawLater(p, ms, alive) {
  await sleep(ms); if (!alive()) return;
  const d = p.play('Draw', { once: true, fade: 0.1 }); await sleep(d); if (!alive()) return;
  if (p.current === p.mixer.clipAction(p.clips.Draw)) p.play('Ready');
}

// ---------- pieces
// each piece type: model + clips + forward speed per phase of its Walk cycle (measured in Blender from the
// planted foot, so walking never slides)
const loader = new GLTFLoader(), v = '?v=' + Date.now();
async function loadType(name) {
  const g = await loader.loadAsync(`models/${name}.glb${v}`);
  return { gltf: g, clips: Object.fromEntries(g.animations.map(a => [a.name.split('|').pop(), a])),
           walk: await (await fetch(`models/${name}_walk.json${v}`)).json() };
}
const TYPES = { Pawn: await loadType('Pawn'), Knight: await loadType('Knight'), Bishop: await loadType('Bishop'), Rook: await loadType('Rook'), Queen: await loadType('Queen'), King: await loadType('King') };
const gltf = TYPES.Pawn.gltf;

function makePiece(black, type = 'Pawn') {
  const T = TYPES[type], clips = T.clips;
  const root = SkeletonUtils.clone(T.gltf.scene);
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    o.material = o.material.clone();
    if (o.material.name === 'PieceBody') {
      if (black) { o.material.color.set(0x2c2c31); o.material.roughness = 0.38; }
      else { o.material.color.set(0xc9c6bf); o.material.roughness = 0.5; }
      stoneify(o.material);
    } else if (o.material.name === 'Glow') {   // the bishop's orb
      o.material = new THREE.MeshStandardMaterial({ color: 0xbfe0ff, emissive: 0x6aa8ff, emissiveIntensity: 1.2, name: 'Glow' });
    } else if (o.material.name === 'Trim') {   // gilded accents (design board)
      o.material.color.set(black ? 0xb08a48 : 0xd4a85c); o.material.metalness = 1; o.material.roughness = 0.3;
      stoneify(o.material, 38, 0.25);
    }
  });
  const mixer = new THREE.AnimationMixer(root);
  const mats = [], bones = [];
  root.traverse(o => {
    if (o.isMesh && o.material.userData.uCrumble) mats.push(o.material);
    if (o.isBone) bones.push(o);
  });
  const p = { root, mixer, current: null, bones, clips, walkCurve: T.walk, type };
  root.traverse(o => { if (o.isMesh && o.material.name === 'Glow') p.glow = o.material; });
  p.setCrumble = v => mats.forEach(m => m.userData.uCrumble.value = v);
  p.play = (name, { once = false, fade = 0.2 } = {}) => {
    const a = mixer.clipAction(clips[name]);
    a.reset(); a.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat); a.clampWhenFinished = once;
    if (p.current && p.current !== a) a.crossFadeFrom(p.current, fade, false);
    a.play(); p.current = a;
    return clips[name].duration * 1000;
  };
  scene.add(root);
  return p;
}
const white = makePiece(false), black = makePiece(true), knight = makePiece(false, 'Knight'), bishop = makePiece(false, 'Bishop'), rook = makePiece(false, 'Rook'), queen = makePiece(false, 'Queen'), king = makePiece(false, 'King');
const black2 = makePiece(true), black3 = makePiece(true); black2.root.visible = black3.root.visible = false;
knight.root.visible = false; bishop.root.visible = false; rook.root.visible = false; queen.root.visible = false; king.root.visible = false;

// ---------- battle script
let token = 0;
// Walk toward z: the piece advances by the measured foot-lock speed for the current phase of the Walk
// clip, so the foot carrying the weight stays planted on the board (driven from the render loop).
function moveTo(p, z) {
  p.play('Walk');
  return new Promise(res => { p.walk = { z, res, my: token }; });
}
function stepWalk(p, dt) {
  const w = p.walk; if (!w) return;
  if (w.my !== token) { p.walk = null; return; }
  const a = p.current, dur = a.getClip().duration;
  const phase = (a.time % dur) / dur, sp = p.walkCurve.speed;
  footDust(p, phase);
  const v = sp[Math.min(sp.length - 1, Math.floor(phase * sp.length))] * a.getEffectiveWeight();
  const dir = Math.sign(w.z - p.root.position.z);
  p.root.position.z += dir * v * dt;
  if (Math.sign(w.z - p.root.position.z) !== dir || dir === 0) { p.root.position.z = w.z; p.walk = null; w.res(); }
}
// stone statues crumble while they die: the surface flakes away (shader) and chunks fall off the limbs
const rubbleGeo = [new THREE.DodecahedronGeometry(1, 0), new THREE.IcosahedronGeometry(1, 0), new THREE.BoxGeometry(1.4, 1, 1.2)];
let rubble = [];
const _v = new THREE.Vector3();
function chunk(p, at, size, kick) {
  const m = new THREE.Mesh(rubbleGeo[(Math.random() * 3) | 0], p.rubbleMat);
  const r = size * (0.5 + Math.random());
  m.scale.set(r, r * (0.6 + Math.random() * 0.6), r);
  m.position.copy(at).add(new THREE.Vector3((Math.random() - .5) * .12, (Math.random() - .5) * .12, (Math.random() - .5) * .12));
  m.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
  m.castShadow = true;
  m.userData.v = new THREE.Vector3((Math.random() - .5) * kick, Math.random() * kick * 0.6, (Math.random() - .5) * kick);
  m.userData.r = r; m.userData.spin = (Math.random() - .5) * 10;
  scene.add(m); rubble.push(m);
}
async function dieCrumbling(p, durMs, start = 0.12) {   // start: fraction of durMs when the blow lands
  const my = token, t0 = performance.now();
  let next = 0;
  const base = p.root.getObjectByProperty('type', 'SkinnedMesh').material;   // rubble gets its own fadeable stone
  p.rubbleMat = new THREE.MeshStandardMaterial({ color: base.color.clone(), roughness: base.roughness, transparent: true });
  stoneify(p.rubbleMat);
  const mine = () => rubble.filter(m => m.material === p.rubbleMat);
  while (performance.now() - t0 < durMs) {
    if (my !== token) return;
    const u = (performance.now() - t0) / durMs;
    const c = Math.max(0, (u - start) / (1 - start));          // starts cracking right after the blow lands
    p.setCrumble(c * c * 0.62);                         // eaten-away fraction grows as it falls
    if (performance.now() - t0 > next && u > start) {    // pieces drop off random limbs as it goes
      const b = p.bones[(Math.random() * p.bones.length) | 0];
      chunk(p, b.getWorldPosition(_v), 0.03 + c * 0.03, 0.6);
      next = performance.now() - t0 + 70 - c * 40;
    }
    await sleep(16);
  }
  for (const b of p.bones) {                            // the rest collapses into a heap where it lay
    b.getWorldPosition(_v);
    for (let i = 0; i < 3; i++) chunk(p, _v, 0.045, 1.0);
  }
  p.root.visible = false;
  // the heap settles, then fades away to nothing
  await sleep(1600); if (my !== token) return;
  const f0 = performance.now();
  p.rubbleMat.depthWrite = false;
  while (performance.now() - f0 < 2200) {
    if (my !== token) return;
    const u = (performance.now() - f0) / 2200;
    p.rubbleMat.opacity = 1 - u * u;
    for (const m of mine()) m.scale.multiplyScalar(0.997);   // and crumbles a little smaller as it goes
    await sleep(16);

}
function stepRubble(dt) {
  for (const m of rubble) {
    const v = m.userData.v;
    if (m.position.y <= m.userData.r * 0.7 && v.y <= 0) { v.multiplyScalar(0.0); continue; }
    v.y -= 9.8 * dt * 0.6;
    m.position.addScaledVector(v, dt);
    m.rotation.x += m.userData.spin * dt;
    if (m.position.y < m.userData.r * 0.7) { m.position.y = m.userData.r * 0.7; v.y = -v.y * 0.25; v.x *= 0.5; v.z *= 0.5; if (Math.abs(v.y) < 0.15) v.y = 0; }
  }
}
// sparks where steel meets steel
let sparks = [];
const sparkGeo = new THREE.BoxGeometry(0.012, 0.012, 0.05);
const flash = new THREE.PointLight(0xffc27a, 0, 3, 2); scene.add(flash);
function sparkBurst(at, color = 0xffd08a) {
  for (let i = 0; i < 40; i++) {
    const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    m.position.copy(at);
    const v = new THREE.Vector3(Math.random() - .5, Math.random() * 0.9, Math.random() - .5).normalize().multiplyScalar(1.5 + Math.random() * 2.5);
    m.userData = { v, life: 0.25 + Math.random() * 0.35, age: 0 };
    scene.add(m); sparks.push(m);
  }
  flash.position.copy(at); flash.intensity = 6;
}
function stepSparks(dt) {
  for (const m of sparks) {
    const u = m.userData; u.age += dt; u.v.y -= 6 * dt;
    m.position.addScaledVector(u.v, dt); m.lookAt(m.position.clone().add(u.v));
    m.material.opacity = Math.max(0, 1 - u.age / u.life);
  }
  sparks = sparks.filter(m => m.userData.age < m.userData.life || (scene.remove(m), false));
  flash.intensity = Math.max(0, flash.intensity - dt * 30);
}
// impact: camera kick + a spray of stone chips from the point of contact
let shake = 0;
function impact(at, strength) {
  shake = strength;
  for (let i = 0; i < 14; i++) chunk(black, at, 0.018, 2.2);
}
// --- effects (battle sheet "ディテール・エフェクト例"): guard/shield flash, foot dust, magic circle + motes

    await at24(queen, 28, alive); for (const sp of spots) magicMotes(sp.clone().setY(1.6), 0xfff0c8, 1000);
    await at24(queen, Q.PILLARS - 2, alive); if (!alive()) return;
    for (const [k, sp] of spots.entries()) {
      runeCircle(sp, 0.6, 0xfff0c8, 1.8, k % 2 ? 0.7 : -0.7);
      for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; lightPillar(sp.clone().add(new THREE.Vector3(Math.cos(a) * 0.55, 0, Math.sin(a) * 0.55)), i * 0.06 + k * 0.1); }
    }
    await at24(queen, Q.BURST - 16, alive); for (const p of foes) p.play('Hit', { once: true, fade: 0.12 });   // driven to their knees
    await at24(queen, Q.BURST, alive); if (!alive()) return;
    for (const sp of spots) { lightPillar(sp); sparkBurst(sp.clone().setY(0.75), 0xfff0c8); }
    shockwave(spots[0].clone(), 0xfff0c8); impact(spots[0].clone().setY(0.75), 0.12);
    await nearEnd24(queen, alive, 0.2); if (!alive()) return;
    say('必殺技 — 女王の審判'); queen.play('Ultimate', { once: true, fade: 0.15 });
    await at24(queen, 14, alive); runeCircle(queen.root.position.clone(), 1.6, 0xc9a6ff, 3.0, 0.3);
    await at24(queen, 24, alive); { const sky = new THREE.Vector3(0, 2.8, -1.1); runeCircle(sky, 1.4, 0xe8dcff, 2.2, -0.6); magicMotes(sky, 0xe8dcff, 1400); }
    await at24(queen, Q.PIERCE - 16, alive); if (!alive()) return;
    const dying = foes.map((p, i) => { const dd = p.play('Death', { once: true, fade: 0.12 }); return dieCrumbling(p, dd * 0.75, 0.29); });
    await at24(queen, Q.SPEARS, alive); if (!alive()) return;
    for (const sp of spots) {
      for (let i = 0; i < 9; i++) { const a = Math.random() * Math.PI * 2, r = 0.25 + Math.random() * 0.6;
        lightSpear(sp.clone().add(new THREE.Vector3(Math.cos(a) * r, 0.02, Math.sin(a) * r)), i * 0.04); }
      lightSpear(sp.clone().add(new THREE.Vector3(0, 0.72, 0.05)), 0.05, 0xfff0c8);   // the spear that pierces each pawn
    }
    await at24(queen, Q.PIERCE, alive); if (!alive()) return;
    for (const sp of spots) sparkBurst(sp.clone().setY(0.72), 0xfff0c8); impact(spots[0].clone().setY(0.72), 0.14);
    await at24(queen, 56, alive);
    for (const sp of spots) { lightPillar(sp, 0, 0xffffff); shockwave(sp.clone(), 0xe8dcff); }
    if (queen.glow) queen.glow.emissiveIntensity = 1.2;
    await nearEnd24(queen, alive, 0.1); if (!alive()) return;
    say('一掃 — 白の勝利！'); queen.play('Victory', { once: true, fade: 0.2 });
    await Promise.all(dying); if (!alive()) return;
    await sleep(2500);
  }
}
// the king's special: a golden shockwave rings out across the board where the greatsword bites it
let waves = [];
function shockwave(at, color = 0xffd27a) {
  for (let i = 0; i < 2; i++) {
    const m = new THREE.Mesh(new THREE.RingGeometry(0.85, 1, 64),
      new THREE.MeshBasicMaterial({ color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    m.rotation.x = -Math.PI / 2; m.position.copy(at); m.position.y = 0.02 + i * 0.005;
    m.userData = { age: -i * 0.12, life: 0.9 }; m.scale.setScalar(0.01); scene.add(m); waves.push(m);
  }
  flash.position.copy(at).setY(0.5); flash.color.set(0xffc860); flash.intensity = 60;
}
function stepWaves(dt) {
  for (const m of waves) {
    const u = m.userData; u.age += dt; const k = Math.max(0, u.age / u.life);
    m.scale.setScalar(0.01 + 2.6 * Math.sqrt(k)); m.material.opacity = u.age < 0 ? 0 : Math.max(0, 1 - k) * 0.9;
  }
  waves = waves.filter(m => m.userData.age < m.userData.life || (scene.remove(m), false));
}
// storyboard row 6: the king raises the greatsword over his crown and cleaves the pawn down into the board
async function kingBattle() {
  const my = ++token; setActive('king');
  const alive = () => my === token;
  controls.autoRotate = true;
  camera.position.set(4.6, 2.8, 2.4); controls.target.set(0, 0.8, 0.2);
  while (alive()) {
    place(); white.root.visible = false;
    king.root.visible = true; king.root.position.set(0, 0, 2.0); king.root.rotation.y = Math.PI;
    king.play('Idle', { fade: 0 }); black.play('Idle', { fade: 0 }); drawLater(black, 1000, alive);
    say('白のキングが歩み出る'); await sleep(1300); if (!alive()) return;
    await moveTo(king, 0.65); if (!alive()) return;   // 1.65 squares (king_anims KING_DUEL_BLOCK)
    king.play('Idle'); await sleep(300); if (!alive()) return;
    if (!await pieceBlocked(king, 0.945, alive, 'キングの剣 — 黒は双剣で受け止める')) return;
    if (!await pawnCounter(king, 0.65, alive, '黒の反撃 — キングが盾で受ける')) return;
    await moveTo(king, 0.0); if (!alive()) return;
    king.play('Idle', { fade: 0.15 }); await sleep(200); if (!alive()) return;
    say('王の一撃！'); const d = king.play('Attack', { once: true });
    const dd = black.play('Death', { once: true });
    const dying = dieCrumbling(black, dd * 0.75, 0.29);
    await sleep(667); if (!alive()) return;   // frame 16: through the chest
    const at = new THREE.Vector3(0, 0.75, -0.95); sparkBurst(at); impact(at, 0.08);
    await sleep(125); if (!alive()) return;   // frame 19 (KING_SLAM_FRAME): the blade bites the board
    shockwave(new THREE.Vector3(0, 0, -1.0)); impact(new THREE.Vector3(0, 0.05, -1.0), 0.2);
    await sleep(d - 792 + 200); if (!alive()) return;
    say('白の勝利！'); king.play('Victory', { once: true });
    await dying; if (!alive()) return;
    await sleep(2500);
  }
}
async function showClip(name) {
  ++token; setActive(name);
  const [type, clip] = name.includes(':') ? name.split(':') : ['Pawn', name];
  const p = type === 'Knight' ? knight : type === 'Bishop' ? bishop : type === 'Rook' ? rook : type === 'Queen' ? queen : type === 'King' ? king : white;
  place(); white.root.visible = p === white; knight.root.visible = p === knight; bishop.root.visible = p === bishop; rook.root.visible = p === rook; queen.root.visible = p === queen; king.root.visible = p === king;
  p.root.position.set(0, 0, 0.5); p.root.rotation.y = 0.6;
  black.root.position.set(0, 0, -30);
  say(`白${type === 'Knight' ? 'ナイト' : 'ポーン'}：${clip}`);
  const d = p.play(clip, { once: !['Idle', 'Walk'].includes(clip), fade: 0.1 });
  if (clip === 'Death') dieCrumbling(p, d * 0.75, 0.29);
}

// ---------- UI
const btns = document.getElementById('buttons');
const labels = { battle: 'ポーン戦', knight: 'ナイト戦', bishop: 'ビショップ戦', rook: 'ルーク戦', queen: 'クイーン戦', king: 'キング戦', knightLeap: 'ナイト跳躍', knightGlide: 'ナイト滑空攻撃', knightSkill: 'ナイトスキル', rookIai: 'ルーク居合', 'King:Attack': 'キング攻撃', 'King:Victory': 'キング勝利', 'Rook:Walk': 'ルーク歩行', 'Bishop:Attack': 'ビショップ詠唱', 'Knight:Idle': 'ナイト待機', 'Knight:Walk': 'ナイト歩行',
  'Knight:Attack': 'ナイト突進', 'Knight:Victory': 'ナイト勝利', 'Knight:Death': 'ナイト死亡', Idle: '待機', Walk: '歩行', Draw: '抜刀', Ready: '構え', Attack: '二連斬り', AttackBlocked: '攻撃(受けられる)', Clash: '斬り合い', Dodge: '回避', Combo: '通常コンボ', Heavy: '重攻撃', Rush: 'ラッシュ', Counter: 'カウンター', Block: '防御', Hit: 'ダメージ', Death: '死亡', Victory: '勝利' };
function setActive(k) { for (const b of btns.children) b.classList.toggle('on', b.dataset.k === k); }
for (const k of Object.keys(labels)) {
  const b = document.createElement('button'); b.textContent = labels[k]; b.dataset.k = k;
  b.onclick = () => k === 'battle' ? battle() : k === 'knight' ? knightBattle() : k === 'bishop' ? bishopBattle() : k === 'rook' ? rookBattle() : k === 'queen' ? queenBattle() : k === 'king' ? kingBattle() : k === 'knightLeap' ? knightLeap() : k === 'knightGlide' ? knightGlide() : k === 'knightSkill' ? knightSkill() : k === 'rookIai' ? rookIai() : showClip(k);
  btns.appendChild(b);
}
window.preview = { knightGlide, rookIai, knightLeap, kingBattle, king, queenBattle, queen, battle, knightBattle, bishopBattle, rookBattle, rook, bishop, knight, showClip, white, black, gltf,   // debug handles
  cam: ([x, y, z], [tx, ty, tz] = [0, 0.6, -0.5]) => { controls.autoRotate = false; camera.position.set(x, y, z); controls.target.set(tx, ty, tz); controls.update(); },
  fxCount: () => fx.length,
  freeze: (on = true) => { fxScale = on ? 0 : 1; for (const p of [white, black, knight, bishop, rook, queen, king]) p.mixer.timeScale = on ? 0 : 1; } };

// ---------- loop
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  for (const p of [white, black, black2, black3, knight, bishop, rook, queen, king]) { p.mixer.update(dt); stepWalk(p, dt); stepWalkV(p, dt); stepGlide(p); } for (const q of [white, black, queen, king, knight, rook]) stepTrails(q, dt); stepFx(dt); stepLunge(black); stepRubble(dt); stepSparks(dt); stepWaves(dt);
  candles.forEach((l, i) => l.intensity = 5 * (1 + Math.sin(t * 9 + i * 2) * 0.12 + Math.sin(t * 23 + i) * 0.07));
  skyUniforms.uTime.value = t; arenaTime.value = t;
  controls.update();
  if (shake > 0.001) {   // decaying camera kick
    camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake;
    shake *= Math.pow(0.02, dt);
  }
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
battle();
